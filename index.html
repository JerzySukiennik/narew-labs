<!doctype html>
<html lang="pl" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Narew Labs</title>
<meta name="description" content="Modele AI trenowane od zera w Gzowie. Chat, Image Studio i reszta w jednym miejscu.">
<meta name="theme-color" content="#0c0c0b" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/favicon.svg">

<script>
  /* Theme before first paint. Reading it in a module would run after the first
     frame and flash the wrong background at every load. Dark is the default;
     the stored choice wins over the system. */
  (function () {
    try {
      var saved = localStorage.getItem('narew.theme');
      document.documentElement.dataset.theme =
        saved === 'light' || saved === 'dark' ? saved : 'dark';
    } catch (e) { /* private mode: the default in the markup stands */ }
  })();
</script>

<!-- The page's own ground, painted before a single stylesheet has been asked
     for. Until tokens.css arrives the browser paints its default behind the
     document, and any region the boot screen does not cover - the overscroll
     band above and below it, most visibly on a trackpad - is that default
     rather than ours. Declaring both here means there is no moment and no strip
     where the ground is a colour we did not choose. -->
<style>
  html { background: #0c0c0b; color-scheme: dark; }
  html[data-theme='light'] { background: #fbfaf7; color-scheme: light; }
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Only the fallback is downloaded. Apple devices resolve -apple-system to the
     real San Francisco before this file is ever needed. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">

<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/shell.css">
<link rel="stylesheet" href="css/chat.css">
<link rel="stylesheet" href="css/studio.css">
<link rel="stylesheet" href="css/panels.css">
</head>

<body>
<!-- The first thing Tab reaches. A keyboard user landing here would otherwise
     walk the whole sidebar before reaching the thing they came for, on every
     single page. Hidden until focused, which is the only time it is useful. -->
<a class="skip" href="#view-host">Przejdź do treści</a>

<!-- Grain, fixed and unclickable. Flat digital colour has no surface to it; a
     little noise gives the black something to be made of, and it costs one
     element and no requests - the texture is drawn by the browser rather than
     downloaded. -->
<div class="grain" aria-hidden="true"></div>

<!-- ============================================================ boot gate == -->
<!-- Shown until Firebase answers whether anyone is signed in. Without it the
     app would flash the signed-out screen at every reload of a signed-in user. -->
<div id="boot" class="boot">
  <div class="boot__mark" aria-hidden="true">
    <svg viewBox="0 0 32 32" width="34" height="34" fill="none" stroke="currentColor"
         stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 26V6"/><path d="M25 26V6"/>
      <path d="M7 6c4.2 3.6 3.4 7.8 6.6 9.4 3.2 1.6 5-1 7 2.2 1.5 2.4 2.3 5.2 4.4 8.4"/>
    </svg>
  </div>
  <p class="boot__text label">Narew Labs</p>
  <span class="boot__thread" aria-hidden="true"></span>
</div>

<!-- ============================================================== gate == -->
<!-- Standalone screens: no sidebar, no chrome. Signed out and first-run
     onboarding are not views among views - they are what the app shows
     before it can honestly show anything else. -->
<div id="gate-host" class="screen-host hidden"></div>
<div id="onboard-host" class="screen-host hidden"></div>

<!-- ================================================================= app == -->
<div id="app" class="app hidden" data-sidebar="expanded">

  <!-- ------------------------------------------------------------ sidebar -- -->
  <aside id="sidebar" class="sidebar" aria-label="Nawigacja">

    <div class="sidebar__head">
      <button id="sidebar-toggle" class="brand" aria-label="Zwiń panel"
              aria-expanded="true" aria-controls="sidebar">
        <span class="brand__mark" aria-hidden="true">
          <svg viewBox="0 0 32 32" width="26" height="26" fill="none" stroke="currentColor"
               stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 26V6"/><path d="M25 26V6"/>
            <path d="M7 6c4.2 3.6 3.4 7.8 6.6 9.4 3.2 1.6 5-1 7 2.2 1.5 2.4 2.3 5.2 4.4 8.4"/>
          </svg>
        </span>
        <span class="brand__word">Narew<span class="brand__word-dim"> Labs</span></span>
      </button>
    </div>

    <!-- The palette needs a door you can see. A shortcut nobody is told about
         is a shortcut for the person who wrote it; this is the same command,
         reachable by pointer, and it carries its own key so using it once
         teaches the faster way. -->
    <button id="palette-open" class="rail-search" aria-label="Szukaj i skacz (Command K)">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
           stroke-width="1.9" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
      </svg>
      <span class="rail-search__label">Szukaj i skacz</span>
      <kbd class="rail-search__kbd">⌘K</kbd>
    </button>

    <button id="new-chat" class="new-chat" aria-label="Nowa rozmowa">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
           stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span class="new-chat__label">Nowa rozmowa</span>
    </button>

    <nav class="nav" aria-label="Sekcje">
      <ul id="nav-list">
        <li><a class="nav__item" href="#/chat" data-nav="chat" aria-label="Chat">
          <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 15a2 2 0 0 1-2 2H8l-4 3V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg>
          <span class="nav__label">Chat</span></a></li>

        <li><a class="nav__item" href="#/image" data-nav="image" aria-label="Image Studio">
          <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="m3.5 17 4.8-4.5a2 2 0 0 1 2.7 0L20.5 21"/></svg>
          <span class="nav__label">Image Studio</span></a></li>


        <li><a class="nav__item" href="https://gzowoai.gzowo.fun" data-nav="gzowoai" aria-label="Gzowo AI">
          <svg class="nav__icon nav__icon--sphere" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="4.6" r="1.1" fill="currentColor"/>
            <circle cx="7.2" cy="7.4" r="1" fill="currentColor"/>
            <circle cx="16.8" cy="7.4" r="1" fill="currentColor"/>
            <circle cx="4.6" cy="12" r="1.1" fill="currentColor"/>
            <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
            <circle cx="19.4" cy="12" r="1.1" fill="currentColor"/>
            <circle cx="7.2" cy="16.6" r="1" fill="currentColor"/>
            <circle cx="16.8" cy="16.6" r="1" fill="currentColor"/>
            <circle cx="12" cy="19.4" r="1.1" fill="currentColor"/>
          </svg>
          <span class="nav__label">Gzowo AI</span>
          <svg class="nav__go" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7M8 7h9v9"/></svg></a></li>

        <li class="nav__gap" role="separator"></li>

        <li><a class="nav__item" href="#" data-nav="upgrade" id="nav-upgrade" aria-label="Plan">
          <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12c3-5 6.5-7 10-7 3 0 5 1.6 6 3-1 3.5-4.5 9-10 9-3.2 0-5.2-1.8-6-3.2z"/><path d="M4 12c-.7 2.6-.5 4.6.4 6M8.5 11.5h.01"/></svg>
          <span class="nav__label">Plan</span>
          <span id="nav-tier" class="nav__tier">Płotka</span></a></li>

        <li><a class="nav__item" href="#/settings" data-nav="settings" aria-label="Ustawienia">
          <svg class="nav__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.5 12a7.5 7.5 0 0 0-.1-1.2l2-1.5-2-3.5-2.4 1a7.6 7.6 0 0 0-2-1.2L14.6 2h-4l-.4 2.6c-.7.3-1.4.7-2 1.2l-2.4-1-2 3.5 2 1.5a7.6 7.6 0 0 0 0 2.4l-2 1.5 2 3.5 2.4-1c.6.5 1.3.9 2 1.2l.4 2.6h4l.4-2.6c.7-.3 1.4-.7 2-1.2l2.4 1 2-3.5-2-1.5c.06-.4.1-.8.1-1.2Z"/></svg>
          <span class="nav__label">Ustawienia</span></a></li>
      </ul>
    </nav>

    <!-- The signature element. It is the presence indicator, and it is the
         river: it flows while the Mac at home is awake and goes still the
         moment it is not. Everything else in the sidebar is quiet so this can
         be the one thing that moves. -->
    <div class="sidebar__foot">
      <div id="sidebar-usage" class="sidebar-usage"></div>

      <a href="#/settings" id="bridge-state" class="bridge" data-state="unknown" title="Czy Mac w Gzowie odpowiada">
        <span class="bridge__dot" aria-hidden="true"></span>
        <span id="bridge-text" class="bridge__text">Sprawdzam…</span>
        <span class="bridge__bars" aria-hidden="true">
          <i></i><i></i><i></i><i></i>
        </span>
      </a>

      <a href="#/account" id="user-chip" class="user-chip" data-nav="account" aria-label="Konto">
        <span class="user-chip__portrait">
          <span id="user-avatar" class="user-chip__avatar" aria-hidden="true">?</span>
          <button type="button" id="avatar-edit" class="user-chip__edit" aria-label="Zmień zdjęcie profilowe">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9a2.5 2.5 0 0 0-3.5-3.5L4.5 16.5z"/></svg>
          </button>
          <input type="file" id="avatar-input" accept="image/*" class="sr-only">
        </span>
        <span class="user-chip__body">
          <span id="user-name" class="user-chip__name">Gość</span>
          <span id="user-mail" class="user-chip__mail muted">niezalogowany</span>
        </span>
      </a>
    </div>
  </aside>

  <div id="sidebar-scrim" class="scrim" hidden></div>

  <!-- --------------------------------------------------------------- main -- -->
  <div class="main">
    <header class="topbar">
      <button id="sidebar-open" class="icon-btn topbar__menu" aria-label="Pokaż panel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <h1 id="view-title" class="topbar__title subtitle">Chat</h1>
    </header>

    <main id="view-host" class="view-host" tabindex="-1">
      <section class="view" id="view-chat" data-view="chat" hidden></section>
      <section class="view" id="view-image" data-view="image" hidden></section>
      <section class="view" id="view-video" data-view="video" hidden></section>
      <section class="view" id="view-settings" data-view="settings" hidden></section>
      <section class="view" id="view-account" data-view="account" hidden></section>
    </main>
  </div>
</div>

<!-- ============================================================== overlays == -->
<!-- Two hosts, not one. Both layers used to render into #overlay-host and both
     cleared it with innerHTML = '', so opening the checkout destroyed the plans
     sheet's DOM while ui.js still believed it was open - which left .app parked
     at scale(0.985) with overflow hidden long after everything had closed. They
     stack now: the sheet holds the plans, the dialog opens above it. -->
<div id="drawer-host" class="overlay-host overlay-host--drawer" hidden></div>
<div id="overlay-host" class="overlay-host" hidden></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<noscript>
  <!-- The same stack as the app, spelled out: this paragraph is the one thing
       that has to render when nothing else does, so it cannot rely on a custom
       property from a stylesheet. -->
  <p style="padding:2rem;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',system-ui,sans-serif">Narew Labs potrzebuje JavaScriptu - cała aplikacja to jedna strona.</p>
</noscript>

<script type="module" src="js/main.js"></script>
</body>
</html>
